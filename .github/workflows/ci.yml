name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          test -f AGENTS.md
          test -f docs/product/PRD-v0.1.md
          test -f docs/product/backlog.md
          test -f docs/architecture/adr/ADR-001-modular-monolith.md

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run API tests
        run: mvn -f apps/api/pom.xml test

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck API client and web
        run: npm run typecheck
