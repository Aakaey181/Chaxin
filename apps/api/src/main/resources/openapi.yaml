openapi: 3.1.0
info:
  title: Zhuixun API
  version: 0.1.0
paths:
  /api/auth/session:
    get:
      summary: Return placeholder beta session
      responses:
        "200":
          description: Current session
  /api/people:
    get:
      summary: List people followed by the demo user
      responses:
        "200":
          description: People list
  /api/platform-accounts:
    get:
      summary: List platform accounts bound to people
      responses:
        "200":
          description: Platform account list
  /api/follows:
    get:
      summary: List follows for the demo user
      responses:
        "200":
          description: Follow list
  /api/feed/mock:
    get:
      summary: List mock feed items
      responses:
        "200":
          description: Mock timeline
