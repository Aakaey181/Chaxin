services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zhuixun
      POSTGRES_USER: zhuixun
      POSTGRES_PASSWORD: zhuixun_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuixun -d zhuixun"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

